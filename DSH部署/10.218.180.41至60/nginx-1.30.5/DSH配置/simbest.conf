  # ============ DSH 服务器本机版（10.218.180.45）============
  # 分工：跳板机(159/160) simbest.conf 只做统一转发（upstream → 本机 8088，
  #       并透传 Host）；本机在此按 Host 二次分发到回环 DSH 实例
  # 与跳板机 simbest.conf 的 WebSocket/SSE map 保持一致

  # ============ DSH 实例路由表 ============
  # 加实例只加行
  map $host $dsh_backend {
      test03.dsh.internal  127.0.0.1:7103;
      # test01.dsh.internal  127.0.0.1:7101;   # 以后加实例/用户：加行即可
      # test02.dsh.internal  127.0.0.1:7102;
      # test04.dsh.internal  127.0.0.1:7104;
      default              "";
  }

  # ============ WebSocket/SSE 升级 ============
  map $http_upgrade $connection_upgrade {
      default  upgrade;
      ''       close;
  }

  # ============ 统一入口 ============
  server {
      listen 8088;
      # 网络策略不开放 80 端口，仅提供 8088 访问

      server_name *.dsh.internal dsh.internal;

      location / {
          if ($dsh_backend = "") { return 404; }

          proxy_pass http://$dsh_backend;
          proxy_http_version 1.1;
          # 必须用 $http_host（保留浏览器原始 Host，含端口）：/api 信任门要求
          # Origin 与 Host 完全一致；$host 会剥掉 :8088，导致 /api 全部 403
          proxy_set_header Host $http_host;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          # SSE/长流（/api/remote.mux 等）：关闭缓冲，拉长空闲读超时
          proxy_buffering off;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
      }
  }
