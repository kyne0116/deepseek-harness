  # ============ WebSocket/SSE 升级 ============
  # 与 DSH 服务器(10.218.180.45)上的 simbest.conf 保持一致
  map $http_upgrade $connection_upgrade {
      default  upgrade;
      ''       close;
  }

  # ============ DSH 入口 upstream + 主动健康检查 ============
  # 为 /ngStatus(check_status) 提供探测目标：对 DSH 入口做 TCP 探活
  # 故障约 fall*interval(9s) 判 down（fall=3 × interval=3s），恢复约 rise*interval(6s) 判回 up
  upstream dsh_entry {
      server 10.218.180.45:8088;
      check interval=3000 rise=2 fall=3 timeout=2000 type=tcp;
  }

server {
	listen       8088;
	# listen     80;    # 网络策略不开放 80 端口，仅提供 8088 访问
	server_name  *.dsh.internal dsh.internal;

	#默认根目录
#	location / {
#		root  /cmcc/libs/nginx/html;
#		index  index.html index.htm;
#	}

	#连接数检查
	location /appNgStatus {
		stub_status on;
		access_log logs/status.log;
		auth_basic "NginxStatus";
    }

	#健康状态
	location /ngStatus {
		check_status;
		access_log   off;
		#allow SOME.IP.ADD.RESS;
		#deny all;
    }

	#日志分割
	if ($time_iso8601 ~ "^(\d{4})-(\d{2})-(\d{2})") {
		set $year $1;
		set $month $2;
		set $day $3;
	}
	access_log logs/access-$year-$month-$day.log main;


	error_page   500 502 503 504  /50x.html;


    location = /50x.html {
        root   html;
    }

    #禁止访问的文件.htxxx
    location ~ /\.ht {
        deny all;
    }

	# ============ DSH 统一入口转发 ============
	# 跳板机不做实例路由：统一转发到 DSH 服务器入口，由其 simbest.conf 按 Host 二次分发
	# Host 必须透传，否则 DSH 端 map 查不到实例
	# 必须用 $http_host（保留浏览器原始 Host，含端口）：DSH /api 信任门要求
	# Origin 与 Host 完全一致；$host 会剥掉 :8088，导致 /api 全部 403（"自动重连中"）
	location / {
		proxy_pass http://dsh_entry;   # 走 upstream，/ngStatus 可见探活状态
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		# SSE/长流（/api/remote.mux 等）：关闭缓冲，拉长空闲读超时
		proxy_buffering off;
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}

}